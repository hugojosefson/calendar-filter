name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: denoland/setup-deno@v2
      - run: deno task test
      # Installer needs package-manager/download/cache permissions for Chromium.
      - run: deno run --allow-all npm:playwright@1.62.1 install --with-deps chromium
      - run: deno task test:browser
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: denoland/setup-deno@v2
      - run: deno fmt --check
      - run: deno lint
      - run: deno check

  publish:
    runs-on: ubuntu-latest
    needs: [test, check]

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: denoland/setup-deno@v2

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release a new version
        if: github.event_name == 'push'
        run: deno task release:run

      - name: Publish the new version
        run: deno publish
